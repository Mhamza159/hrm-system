<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Deep Forest Charcoal) -->
    <linearGradient id="elvara-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A241B" />
      <stop offset="100%" stop-color="#04120D" />
    </linearGradient>

    <!-- Vibrant Emerald Brand Gradient -->
    <linearGradient id="elvara-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F08B" />
      <stop offset="50%" stop-color="#00C471" />
      <stop offset="100%" stop-color="#049856" />
    </linearGradient>

    <!-- Soft Ambient Aura -->
    <radialGradient id="elvara-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00C471" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00C471" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="elvara-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C471" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0E3D2D" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#elvara-bg)" stroke="url(#elvara-border)" stroke-width="2" />

  <!-- Inner Ambient Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#elvara-glow)" />

  <!-- ELVARA Monogram Emblem (Stylized Geometric 'E' & People Pulse) -->
  <g fill="url(#elvara-accent)">
    <!-- Vertical Spine -->
    <rect x="16" y="16" width="6.5" height="32" rx="3.25" />

    <!-- Top Wing -->
    <path d="M16 19.25C16 17.455 17.455 16 19.25 16H42C43.657 16 45 17.343 45 19C45 20.657 43.657 22 42 22H19.25C17.455 22 16 20.545 16 19.25Z" />

    <!-- Center Pulse Bar -->
    <path d="M16 32C16 30.343 17.343 29 19 29H34C35.657 29 37 30.343 37 32C37 33.657 35.657 35 34 35H19C17.343 35 16 33.657 16 32Z" />

    <!-- Bottom Foundation Bar -->
    <path d="M16 44.75C16 43.455 17.455 42 19.25 42H42C43.657 42 45 43.343 45 45C45 46.657 43.657 48 42 48H19.25C17.455 48 16 46.545 16 44.75Z" />

    <!-- Growth Node (Enterprise Connectivity Dot) -->
    <circle cx="43" cy="32" r="3.2" fill="#00F08B" />
  </g>
</svg>
